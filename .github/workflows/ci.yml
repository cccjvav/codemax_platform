# ============================================================================
# GitHub Actions CI（TD-84，已激活）
#
# 2f3223a 由仓库管理员从 docs/github-actions-ci.yml 纯重命名而来（0 增删）。
# 实跑记录：run 33512433132 / 33512433325 / 33513725297 / 33513731149 /
# 33514158624 / 33514166211，conclusion 全为 success；每次两个 job
# （测试（SQLite 后端）、测试（真 PostgreSQL 16））全部 step 通过。
#
# 未能核实的一项：CI 日志正文在本沙箱取不到（下载被重定向到
# *.blob.core.windows.net 后 SSL 失败），故上面只引用 job/step 的 conclusion
# 字段，无法引用日志里「N passed」那一行。
#
# ⚠️ 改这个文件需要仓库管理员出手：Arena 的 GitHub App
# （arena-ai-coding-agent[bot]）没有 Workflows 写权限，由它 push 会得到
#   remote rejected ... without `workflows` permission
# 详见 TD-84 / TD-144。
# ============================================================================
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# 同一分支连续推送时取消上一次还在跑的构建，省 Actions 分钟
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-sqlite:
    name: 测试（SQLite 后端）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: pytest
        run: python -m pytest -q

  test-postgres:
    name: 测试（真 PostgreSQL 16）
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: codemax_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/codemax_test
      PGPASSWORD: postgres
      PGHOST: 127.0.0.1
      PGUSER: postgres

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 建表脚本与 ORM 模型的一致性由 tests/test_schema_sync.py 保证；
      # 这里再验一次它真的能在 PostgreSQL 上执行，而且可以重复执行（幂等）。
      - name: 建表脚本在真 PostgreSQL 上执行（连跑两遍验证幂等）
        run: |
          psql -d postgres -c "CREATE DATABASE codemax_ddl"
          psql -d codemax_ddl -v ON_ERROR_STOP=1 -f "database init/full_init.sql"
          psql -d codemax_ddl -v ON_ERROR_STOP=1 -f "database init/full_init.sql"
          echo "public schema 表数："
          psql -d codemax_ddl -tAc "select count(*) from pg_tables where schemaname='public'"

      - name: pytest
        run: python -m pytest -q
