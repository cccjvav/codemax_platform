# User authorized live verification after configuring AGNES_API_KEY (2026-09-13).
# Independent provider diagnostics; never a replacement for the six normal CI jobs.
# Ordinary pushes are keyless. Explicitly marked, authorized pushes may request live checks.
name: Agnes connectivity diagnosis
on:
  workflow_dispatch:
    inputs:
      live_chat:
        description: "Run model listing, chat, Mermaid and one embedding probe using repository secret AGNES_API_KEY"
        required: true
        default: false
        type: boolean
  push:
    branches: ["arena/01a0bf7a-codemax-platform"]
    paths: [".github/workflows/agnes-connectivity.yml"]
permissions:
  contents: read
jobs:
  connectivity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe HTTPS without credentials
        id: network
        shell: bash
        run: |
          set +e
          status=$(curl --silent --show-error --connect-timeout 10 --max-time 25 \
            --output /dev/null --write-out '%{http_code}' \
            https://apihub.agnes-ai.com/v1/models)
          result=$?
          echo "http=$status" >> "$GITHUB_OUTPUT"
          echo "curl_exit=$result" >> "$GITHUB_OUTPUT"
          echo "::notice title=Agnes network result::HTTP=$status curl_exit=$result; no key sent"
          exit "$result"
      - name: HTTP=${{ steps.network.outputs.http }} curl_exit=${{ steps.network.outputs.curl_exit }} (not authentication)
        if: always()
        run: echo 'This job only checks verified HTTPS reachability, not account or model capability.'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install the same pinned project client without credentials
        run: python -m pip install -r requirements.txt
      - name: Same Python client, verified HTTPS, no Authorization
        run: python scripts/probe_llm.py connectivity
  live-chat:
    if: (github.event_name == 'workflow_dispatch' && inputs.live_chat) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[agnes-live-test]'))
    needs: connectivity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install project dependencies without provider credentials
        run: python -m pip install -r requirements.txt
      - name: Authorized chat checks and bounded capability probes
        env:
          LLM_API_KEY: ${{ secrets.AGNES_API_KEY }}
          LLM_BASE_URL: https://apihub.agnes-ai.com/v1
          LLM_MODEL: agnes-2.5-flash
          LLM_EMBED_ENABLED: "false"
        run: |
          set +e
          run_probe() {
            label=$1
            shift
            output=$("$@" 2>&1)
            result=$?
            printf '%s\n' "$output"
            # Only the probe's already-redacted summary/IDs; escape workflow command delimiters.
            escaped=$(printf '%s' "$output" | python -c "import sys; print(sys.stdin.read()[:4000].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))")
            printf '::notice title=Agnes %s::%s\n' "$label" "$escaped"
            return "$result"
          }
          run_probe models python scripts/probe_llm.py models
          models=$?
          run_probe chat python scripts/probe_llm.py chat
          chat=$?
          run_probe mermaid python scripts/probe_llm.py mermaid
          mermaid=$?
          # One diagnostic of the documented chat model, NOT a recommended embedding configuration.
          run_probe embedding env LLM_EMBED_ENABLED=true LLM_EMBED_MODEL=agnes-2.5-flash python scripts/probe_llm.py embeddings
          embedding=$?
          echo "::notice title=Agnes live results::models_exit=$models chat_exit=$chat mermaid_exit=$mermaid embedding_probe_exit=$embedding"
          test "$chat" -eq 0 && test "$mermaid" -eq 0
