# 本地/单机部署示例。生产上 SSL 与域名解析在反向代理（nginx / 云 LB）那一层做，
# 应用本身只跑 http，靠 X-Forwarded-Proto 感知 https —— 所以 TRUST_PROXY_HEADERS 要开。
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: codemax_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?必须在 .env 里设置 DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 不再自动执行SQL；先显式运行维护CLI，避免无账本/默认身份初始化。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d codemax_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: codemax_db
      DB_USER: postgres
      DATABASE_URL: ""  # 本地示例固定使用上面的db容器，不能误连.env中的外部业务库
      TRUST_PROXY_HEADERS: "true"
    ports:
      - "${APP_BIND_HOST:-127.0.0.1}:8000:8000"
    volumes:
      - uploads:/srv/app/storage

  # Explicit opt-in only. Does not migrate, enable verification, send refunds or record receipts.
  refund-verifier:
    profiles: ["refund-verifier"]
    build: .
    init: true
    restart: "on-failure:5"
    stop_grace_period: 15s
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: codemax_db
      DB_USER: postgres
      DATABASE_URL: ""
      WX_REFUND_SEND_ENABLED: "false"
      WX_REFUND_AUTO_RECORD_ENABLED: "false"
    command: ["python", "-m", "app.refund_worker", "--status-file", "/srv/app/runtime/refund-verifier.json"]
    volumes:
      - verifier-status:/srv/app/runtime
    # Override the image's Web probe: there is deliberately no HTTP listener here.
    # Unhealthy alone does NOT trigger Docker restart; alarms need operator/monitor action.
    healthcheck:
      test: ["CMD", "python", "-m", "app.refund_health", "--status-file", "/srv/app/runtime/refund-verifier.json"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 2

volumes:
  pgdata:
  uploads:
  verifier-status:
