{% extends "base.html" %}
{% block content %}
{% if page_heading %}<h2 class="page-heading">{{ page_heading }}</h2>{% endif %}
<div class="split">
  <section>
    <form id="er-form">
      <textarea id="ddl-input" class="code" rows="16" placeholder="CREATE TABLE sys_user (...);"></textarea>
      <p class="form-actions">
        <button type="submit" id="er-submit">生成 ER 图</button>
        <button type="button" class="ghost" id="er-word">导出 Word</button>
        <button type="button" class="ghost" id="er-sample">填入示例</button>
      </p>
    </form>
    <p id="er-error" class="error" role="alert" hidden></p>
  </section>
  <section class="er-view">
    {# 生成后才显示：大图默认以可读比例打开（看不全时可切换全图），操作方式写在这里而不是让用户猜 #}
    <p id="er-tools" class="er-tools" hidden>
      <button type="button" class="ghost" id="er-fit" hidden>查看全图</button>
      <span>拖动平移，滚轮或双指缩放；鼠标停在表上会高亮它的全部关系。</span>
    </p>
    <svg id="er-canvas" role="img" aria-label="ER 图（生成后显示）"></svg>
  </section>
</div>
<style>
  .er-view { min-width: 0; position: relative; }
  .er-tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 0 0 8px; color: #475569; font-size: var(--fs-small); }
  #er-canvas { cursor: grab; }
  /* 空状态提示（TD-287）：生成前画布是一块空白。#er-tools 在渲染成功后才取消 hidden，借它判断「尚未生成」；
     不支持 :has() 的旧内核只是看不到提示，功能不受影响。pointer-events:none 不挡拖动。 */
  .er-view:has(> #er-tools[hidden])::after { content: "粘贴 CREATE TABLE 语句（或点「填入示例」）后点「生成 ER 图」，结果显示在这里";
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px;
    text-align: center; color: #64748b; pointer-events: none; }
  /* 手机上输入框与画布上下叠放：原来 16 行输入框 + 70vh 画布，结果要滚很远才看得到 */
  @media (max-width: 900px) { #ddl-input { height: 13em; } #er-canvas { height: 60vh; } }
</style>

<!-- d3 **不再走 CDN**（TD-222）：它由 npm 打进 /static/js/er-page.js。
     比原来的「钉版本 + SRI」更强 —— 原来再钉死，代码仍是**运行时**从 jsdelivr 取的，
     本站的任何一次部署都管不到那台服务器；打进产物后代码随部署走，版本由
     package-lock.json 钉死（含 integrity 哈希），且 CI 会核对产物与源码是否同步。
     顺带解决可达性：这是引流页，CDN 在国内不保证可达，d3 加载失败等于整页白屏。
     由 tests/test_frontend_supply_chain.py 钉住「模板里不许再出现 npm CDN 引用」。 -->
<script type="module" src="/static/js/er-page.js"></script>
{% endblock %}
