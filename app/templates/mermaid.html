{% extends "base.html" %}
{% block content %}
<div class="split">
  <section>
    <form id="mermaid-form">
      <textarea id="text-input" rows="12" placeholder="例：电商系统里有用户、商品、订单，一个用户可以下多个订单"></textarea>
      <p>
        <button type="submit" id="mermaid-submit">生成类图</button>
        <button type="button" class="ghost" id="mermaid-sample">填入示例</button>
      </p>
    </form>
    <p id="mermaid-error" class="error" role="alert" hidden></p>
    <pre id="mermaid-source" hidden></pre>
  </section>
  <div id="mermaid-preview"></div>
</div>

<!-- 本地构建的 Mermaid 及分块以 ES module 加载，无运行时 CDN。 -->
<script type="module" src="/static/js/mermaid-page.js"></script>
{% endblock %}
