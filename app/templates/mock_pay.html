{% extends "base.html" %}
{% block content %}
<style>
  .mock-banner{background:#fff3cd;border:2px solid #d39e00;color:#663c00;padding:12px 16px;
    border-radius:8px;font-weight:700;margin-bottom:20px}
  .mock-box{max-width:520px;margin:0 auto;padding:24px;border:1px solid #ddd;border-radius:10px}
  .mock-box code{background:#f4f4f4;padding:2px 6px;border-radius:4px;word-break:break-all}
  #pay{margin-top:16px;padding:10px 22px;font-size:16px;cursor:pointer;border-radius:6px;
    border:1px solid #d39e00;background:#ffc107}
  #out{white-space:pre-wrap;font-size:13px;color:#555;margin-top:16px}
</style>
<section class="mock-box">
  <div class="mock-banner">⚠️ 模拟支付通道 —— 不会产生真实扣款，仅用于本地开发与答辩演示</div>
  <h1>模拟收银台</h1>
  <p>订单号：<code id="no">{{ order_no }}</code></p>
  <p>本页由 <code>SHOP_PAY_MODE=mock</code> 开启；生产环境必须设为 <code>wechat</code>，
     此时本页与模拟支付接口都会返回 404。</p>
  <button id="pay">模拟支付成功</button>
  <pre id="out"></pre>
</section>
<script src="/static/js/mock-pay-page.js"></script>
{% endblock %}
