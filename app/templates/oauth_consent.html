{% extends "base.html" %}
{% block content %}
<section style="max-width: 520px; margin: 40px auto; padding: 24px; border: 1px solid #e2e8f0; border-radius: 8px;">
  <h2 style="margin: 0 0 12px; font-size: 18px;">{{ client_name }} 请求访问你的账号</h2>
  <p>当前登录：<strong>{{ username }}</strong></p>
  <p style="color: #64748b;">
    同意后，该应用可以代表你访问本站的受保护资源（单点登录）。
    它<strong>拿不到</strong>你的密码。
  </p>
  <p style="color: #64748b; font-size: 13px;">回调地址：<code>{{ redirect_uri }}</code></p>
  {# 纯表单，无脚本；auth_ui=False 同时关闭 base.html 登录脚本。
     当前 script-src 不允许 unsafe-inline；内联样式是另一条 style-src 策略。 #}
  <form method="post" action="/oauth/authorize" style="display: flex; gap: 8px; margin-top: 16px;">
    <input type="hidden" name="client_id" value="{{ client_id }}" />
    <input type="hidden" name="redirect_uri" value="{{ redirect_uri }}" />
    <input type="hidden" name="state" value="{{ state }}" />
    <input type="hidden" name="sig" value="{{ sig }}" />
    <button type="submit" name="approve" value="1">同意授权</button>
    <button type="submit" name="approve" value="0" class="ghost">拒绝</button>
  </form>
</section>
{% endblock %}
